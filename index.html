<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B6B4F">
<meta name="description" content="ItaliaNow: live public transport departures and journeys across Italy.">
<title>ItaliaNow</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="live.css">
</head>
<body>
<div class="device" id="app">
  <div id="map" role="region" aria-label="Map"></div>
  <div class="topbar">
    <div class="brandbar">
      <div class="logo"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17V7a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v10"/><path d="M5 12h14"/><path d="m7 21 2-3M17 21l-2-3"/></svg></i>ItaliaNow</div>
      <div class="spacer"></div>
      <span id="netBadge"></span>
    </div>
    <div id="strikeSlot"></div>
    <div id="legend" class="legend" hidden aria-label="Live vehicles"></div>
  </div>
  <div class="map-ctrls">
    <button class="fab" id="locate" aria-label="Show my location"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
  </div>
  <button class="here-btn" id="hereBtn" hidden></button>
  <section class="sheet" id="sheet" aria-label="Panel">
    <div class="grab" id="grab" role="button" tabindex="0" aria-label="Resize panel"><span></span></div>
    <div class="sheet-body" id="body"></div>
  </section>
  <nav class="nav" id="nav" aria-label="Main"></nav>
  <div id="overlay"></div>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
